<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kablo Tip Asistanı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0EB; --sheet:#FAFBF8; --ink:#1D282C; --ink2:#55636A; --rule:#C9D0C8; --rule2:#DFE4DD;
  --a:#16756C; --a-soft:#D6ECE8; --b:#8B3A68; --b-soft:#F1DDE8; --warn:#B86E00; --warn-soft:#F7E8CC;
  --focus:#1F5FBF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#151B1D; --sheet:#1C2427; --ink:#E4EAE6; --ink2:#9AA8A9; --rule:#34403F; --rule2:#2A3436;
    --a:#5CC2B5; --a-soft:#1E3A37; --b:#D88AB7; --b-soft:#3D2433; --warn:#E6A93E; --warn-soft:#3B2F18; --focus:#7FB0FF;
  }
}
:root[data-theme="dark"]{
  --paper:#151B1D; --sheet:#1C2427; --ink:#E4EAE6; --ink2:#9AA8A9; --rule:#34403F; --rule2:#2A3436;
  --a:#5CC2B5; --a-soft:#1E3A37; --b:#D88AB7; --b-soft:#3D2433; --warn:#E6A93E; --warn-soft:#3B2F18; --focus:#7FB0FF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;
  background-image:linear-gradient(var(--rule2) 1px,transparent 1px),linear-gradient(90deg,var(--rule2) 1px,transparent 1px);
  background-size:24px 24px;}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 64px}

/* Başlık bloğu: teknik resim antet kutusu gibi */
.titleblock{display:grid;grid-template-columns:1fr auto;border:1.5px solid var(--ink);background:var(--sheet)}
.tb-main{padding:14px 18px;border-right:1.5px solid var(--ink)}
.tb-main h1{margin:0;font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.tb-main p{margin:4px 0 0;color:var(--ink2);font-size:15px}
.tb-side{display:grid;grid-template-rows:1fr 1fr;min-width:250px}
.tb-cell{padding:8px 14px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;justify-content:center}
.tb-cell:last-child{border-bottom:0}
.tb-cell small{color:var(--ink2);font-size:12px}
.tb-cell b{font-size:17px;font-weight:600}
.upload-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:10px 0 0;font-size:14px;color:var(--ink2)}
.btn{border:1.5px solid var(--ink);background:var(--sheet);padding:7px 14px;cursor:pointer;font-weight:600;border-radius:2px}
.btn:hover{background:var(--ink);color:var(--sheet)}
.btn.ghost{border-color:var(--rule);font-weight:500}
.btn.ghost:hover{background:var(--rule2);color:var(--ink)}
#status{min-height:1.4em}
.pagepick{display:flex;gap:6px;align-items:center}
.pagepick[hidden]{display:none}
.pagepick select{border:1px solid var(--rule);background:var(--sheet);padding:5px 6px}
#status.err{color:#C62828;font-weight:600}

/* Komut satırı */
.query{margin:22px 0 8px;display:flex;gap:0;border:1.5px solid var(--ink);background:var(--sheet)}
.query label{padding:0 14px;display:flex;align-items:center;font-weight:700;border-right:1.5px solid var(--ink);white-space:nowrap}
.query input{flex:1;min-width:0;border:0;background:transparent;padding:14px;font-size:20px}
.query input:focus-visible{outline:none}
.query:focus-within{box-shadow:0 0 0 3px var(--focus)}
.query button{border:0;border-left:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);padding:0 20px;font-weight:700;cursor:pointer}
.hint{font-size:14px;color:var(--ink2);margin:0 0 14px}
.typegrid{display:flex;flex-wrap:wrap;gap:4px}
.typegrid button{min-width:44px;padding:5px 6px;border:1px solid var(--rule);background:var(--sheet);cursor:pointer;font-weight:600;font-size:14px;border-radius:2px}
.typegrid button:hover{border-color:var(--ink)}
.typegrid button[aria-pressed="true"]{background:var(--a);border-color:var(--a);color:#fff}
.typegrid button.selB[aria-pressed="true"]{background:var(--b);border-color:var(--b)}
.typegrid button.dead{color:var(--ink2);text-decoration:line-through}
.modes{display:flex;gap:0;margin:22px 0 0;border-bottom:1.5px solid var(--ink)}
.modes button{border:1.5px solid transparent;border-bottom:0;background:none;padding:9px 16px;cursor:pointer;font-weight:600;color:var(--ink2);margin-bottom:-1.5px}
.modes button[aria-selected="true"]{border-color:var(--ink);background:var(--sheet);color:var(--ink)}
.panel{background:var(--sheet);border:1.5px solid var(--ink);border-top:0;padding:20px}
.empty{color:var(--ink2);padding:30px 0;text-align:center}

/* Tip başlığı */
.typehead{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:start;padding-bottom:16px;border-bottom:1.5px solid var(--ink);margin-bottom:18px}
.tnum{font-size:64px;line-height:.9;font-weight:700;letter-spacing:-.03em}
.tnum small{display:block;font-size:14px;letter-spacing:0;font-weight:600;color:var(--ink2);margin-bottom:6px}
.tdesc{font-size:20px;font-weight:600;margin:2px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.chip{border:1px solid var(--ink);padding:1px 8px;font-size:13px;font-weight:600;border-radius:999px}
.chip.none{border-style:dashed;color:var(--ink2);font-weight:500}
.chip.a{background:var(--a-soft);border-color:var(--a)}
.chip.b{background:var(--b-soft);border-color:var(--b)}
.meta{font-size:14px;color:var(--ink2);margin:0}
.meta b{color:var(--ink);font-weight:600}

/* Kablo grupları */
.groups{display:grid;gap:14px}
.grp{border:1px solid var(--rule);border-left:4px solid var(--ink)}
.grp.alt{border-left-color:var(--warn);border-left-style:dashed}
.grp header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;align-items:baseline;padding:9px 14px;border-bottom:1px solid var(--rule);background:var(--paper)}
.grp h3{margin:0;font-size:17px;font-weight:700}
.refs{font-size:14px;color:var(--ink2)}
.refs b{color:var(--ink);font-weight:600}
.altnote{margin:0;padding:6px 14px;background:var(--warn-soft);font-size:14px;border-bottom:1px solid var(--rule)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;font-size:12.5px;color:var(--ink2);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--rule)}
td{padding:6px 10px;border-bottom:1px solid var(--rule2);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.conn{font-weight:500}
td.conn .arr{color:var(--ink2);padding:0 4px}
td.num{white-space:nowrap}

/* Kablo çizimi */
.wire{display:inline-block;position:relative;width:84px;height:var(--h,6px);border-radius:var(--h);vertical-align:middle;box-shadow:inset 0 -1px 0 rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.35)}
.wire::before,.wire::after{content:"";position:absolute;top:50%;width:9px;height:max(2px,calc(var(--h) * .45));transform:translateY(-50%);background:linear-gradient(#d9d9d9,#9a9a9a)}
.wire::before{left:-8px;border-radius:2px 0 0 2px}
.wire::after{right:-8px;border-radius:0 2px 2px 0}
.wirecell{padding-left:18px;padding-right:18px;width:120px}
.colorname{white-space:nowrap}

/* Karşılaştırma */
.cmpbar{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:16px}
.cmpbar label{display:flex;flex-direction:column;font-size:13px;color:var(--ink2);font-weight:600}
.cmpbar select{font-size:18px;padding:8px;border:1.5px solid var(--ink);background:var(--sheet);font-weight:600}
.cmpbar .vs{font-weight:700;font-size:20px;padding-top:16px}
.cmphead{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);margin-bottom:18px}
.cmphead>div{padding:12px 16px}
.cmphead>div:first-child{border-right:1.5px solid var(--ink);background:var(--a-soft)}
.cmphead>div:last-child{background:var(--b-soft)}
.cmphead .tnum{font-size:44px}
.verdict{font-size:18px;font-weight:600;margin:0 0 18px;padding:10px 14px;border:1.5px solid var(--ink);background:var(--paper)}
h2.sec{font-size:19px;margin:26px 0 10px;padding-bottom:4px;border-bottom:1.5px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2.sec .n{font-size:14px;color:var(--ink2);font-weight:600}
.tagA,.tagB{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:2px;color:#fff}
.tagA{background:var(--a)} .tagB{background:var(--b)}
.diffrow td{background:var(--warn-soft)}
.side{font-size:14px}
.side b{font-weight:600}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.split .col h3{font-size:16px;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.grplist{border:1px solid var(--rule)}
.grplist table td:first-child{width:44%}
.mark{font-weight:700;text-align:center;width:70px}
.mark.y{color:var(--ink)} .mark.n{color:var(--ink2);font-weight:400}
details.common{margin-top:10px;border:1px solid var(--rule)}
details.common summary{cursor:pointer;padding:9px 14px;font-weight:600;background:var(--paper)}
details.common[open] summary{border-bottom:1px solid var(--rule)}

/* Matris */
.matrix{overflow:auto;max-height:70vh;border:1px solid var(--rule)}
.matrix table{font-size:13px;width:auto}
.matrix th,.matrix td{border:1px solid var(--rule2);padding:4px 6px;text-align:center;white-space:nowrap}
.matrix thead th{position:sticky;top:0;background:var(--sheet);z-index:2;cursor:pointer;color:var(--ink)}
.matrix thead th:hover{background:var(--a-soft)}
.matrix tbody th{position:sticky;left:0;background:var(--sheet);text-align:left;z-index:1;font-weight:500;color:var(--ink);max-width:260px;white-space:normal;min-width:220px}
.matrix tbody th small{color:var(--ink2);display:block}
.matrix td.on{background:var(--ink);color:var(--sheet);font-weight:700}
.matrix .hl{outline:2px solid var(--a);outline-offset:-2px}


/* Benzer tipler */
.simbox{border:1.5px solid var(--ink);margin:0 0 20px;background:var(--paper)}
.simhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px 0}
.simhead h2{margin:0;font-size:18px}
.simbox>.meta{padding:4px 14px 8px;font-size:13.5px}
.seg{display:flex;border:1px solid var(--ink)}
.seg button{border:0;background:var(--sheet);padding:4px 10px;cursor:pointer;font-weight:600;font-size:13px}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.simtbl{background:var(--sheet)}
.simtbl td{border-top:1px solid var(--rule2);border-bottom:0}
.simtbl small{color:var(--ink2)}
.simtbl .rank{width:34px;font-size:22px;font-weight:700;color:var(--ink2);text-align:center}
.simbar{width:170px}
.bar{display:block;height:8px;background:var(--rule2);margin-bottom:3px}
.bar span{display:block;height:100%;background:var(--a)}
.simdiff{min-width:150px}
.simsel td{background:var(--b-soft)}
.btn.small{padding:4px 10px;font-size:13.5px;white-space:nowrap}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 18px}
.actions .meta{margin:0}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn.primary:hover{background:var(--a);border-color:var(--a)}
@media (max-width:760px){.simbar{width:90px}.simtbl .rank{display:none}}
@media (max-width:760px){
  .titleblock{grid-template-columns:1fr}
  .tb-main{border-right:0;border-bottom:1.5px solid var(--ink)}
  .tb-side{grid-template-rows:auto;grid-template-columns:1fr 1fr;min-width:0}
  .tb-cell{border-bottom:0;border-right:1px solid var(--rule)}
  .typehead{grid-template-columns:1fr}
  .tnum{font-size:48px}
  .cmphead,.split{grid-template-columns:1fr}
  .cmphead>div:first-child{border-right:0;border-bottom:1.5px solid var(--ink)}
  .panel{padding:14px}
  .wirecell{width:96px;padding-left:14px;padding-right:12px}
  .wire{width:60px}
}
@media print{
  body{background:#fff}
  .upload-row,.query,.hint,.typegrid,.modes,.cmpbar{display:none}
  .panel{border-top:1.5px solid var(--ink)}
}
/* Loading Overlay */
#loadingOverlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  z-index: 9999; color: white; font-size: 20px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
}
#loadingOverlay.active {
  opacity: 1; pointer-events: auto;
}
.spinner {
  width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.3);
  border-radius: 50%; border-top-color: #fff;
  animation: spin 1s linear infinite; margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingText">PDF yükleniyor...</div>
</div>
<div class="wrap">
  <div class="titleblock">
    <div class="tb-main">
      <h1>Kablo tip asistanı <span style="font-size:16px; color:var(--warn); vertical-align:middle; margin-left:8px; padding:4px 8px; border:1px solid var(--warn); border-radius:4px;">Metraj/Boy Hesaplamalı Sürüm (Test)</span></h1>
      <p id="drawTitle">Ana kablo grubu</p>
      <div class="upload-row">
        <input type="file" id="file" accept="application/pdf,.pdf" hidden>
        <button class="btn" id="uploadBtn" type="button">Yeni çizim yükle (PDF)</button>
        <button class="btn ghost" id="resetBtn" type="button" hidden>Örnek çizime dön</button>
        <label class="pagepick" id="pagePickWrap" hidden>Kablo tablosu sayfası
          <select id="pagePick"><option value="">Otomatik bul</option></select></label>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
    </div>
    <div class="tb-side">
      <div class="tb-cell"><small>Resim no</small><b id="docNo">–</b></div>
      <div class="tb-cell"><small>Revizyon</small><b id="rev">–</b></div>
    </div>
  </div>

  <form class="query" id="qform" autocomplete="off">
    <label for="q">Tip</label>
    <input id="q" inputmode="text" placeholder="55   ya da karşılaştırmak için: 15 55">
    <button type="submit">Göster</button>
  </form>
  <p class="hint">Tek tip yazarsanız o tipin kablolarını, iki tip yazarsanız aralarındaki farkları gösterir. Aşağıdan da seçebilirsiniz.</p>
  <div class="typegrid" id="typegrid"></div>

  <div class="modes" role="tablist">
    <button role="tab" id="tab-sum" aria-selected="true" data-mode="sum">Tip özeti</button>
    <button role="tab" id="tab-cmp" aria-selected="false" data-mode="cmp">İki tipi karşılaştır</button>
    <button role="tab" id="tab-mat" aria-selected="false" data-mode="mat">Tüm tablo</button>
    <button role="tab" id="tab-len" aria-selected="false" data-mode="len">Metraj (Boy) Hesabı</button>
  </div>
  <section class="panel" id="panel" role="tabpanel"></section>
</div>

<script>
// ===== UYGULAMA AYARLARI (KULLANICI BURADAN DEĞİŞTİREBİLİR) =====
const APP_CONFIG = {
  // Teknik resim adını bulmak için aranan başlıklar
  titleKeywords: /ANA KABLO|KABLO GR/i,
  // Matris tablosunu (sayfa 2 veya 3'teki ana tablo) bulmak için referans kelimesi
  matrixTableAnchor: /^REF\.?$/i,
  // Özellik tablosunu (opsiyonların olduğu tablo) bulmak için referans kelimeleri
  featureTableAnchors: [/COMPET[İI]T[İI]VE/i, /STANDART/i],
  // Hacim (volume) kodunu bulmak için aranan desen (Örn: P12, TEK_P54_1750W vb.)
  volumeRegex: /[A-Z0-9_]*P\d+[A-Z0-9_]*/i,
  // Sütunlardaki işaretlenecek özelliklerin listesi (varsayılan)
  defaultFeatureNames: ['İVME SENSÖRÜ','STANDART DOZAGE','AQUATECH','DURUM LED','TURBLYTY','COMPETİTİVE DOZAGE','AQUASTOP','MİKRO FİBER FİLTRE + FLOWMETRE2','FLOWMETRE','JET']
};

// ===== Kablo matrisi ayrıştırıcı (pdf.js 5.x) =====
async function parseDrawing(pdfjsLib, doc, onProgress, opts) {
  opts = opts || {};
  const OPS = pdfjsLib.OPS;
  const log = (m) => onProgress && onProgress(m);
  function mul(m, n) { return [m[0]*n[0]+m[2]*n[1], m[1]*n[0]+m[3]*n[1], m[0]*n[2]+m[2]*n[3], m[1]*n[2]+m[3]*n[3], m[0]*n[4]+m[2]*n[5]+m[4], m[1]*n[4]+m[3]*n[5]+m[5]]; }
  async function getSegments(page, H) {
    const ol = await page.getOperatorList();
    const hs = [], vs = [];
    let ctm = [1,0,0,1,0,0]; const stack = [];
    const tp = (x, y) => [ctm[0]*x+ctm[2]*y+ctm[4], ctm[1]*x+ctm[3]*y+ctm[5]];
    for (let i = 0; i < ol.fnArray.length; i++) {
      const fn = ol.fnArray[i], a = ol.argsArray[i];
      if (fn === OPS.save) stack.push(ctm);
      else if (fn === OPS.restore) ctm = stack.pop() || [1,0,0,1,0,0];
      else if (fn === OPS.transform) ctm = mul(ctm, a);
      else if (fn === OPS.constructPath) {
        const ops = a[0];
        const args = a[1];
        if (!ops || !args) continue;
        let cx = 0, cy = 0, sx = 0, sy = 0, k = 0;
        for (let j = 0; j < ops.length; j++) {
          const op = ops[j];
          if (op === 0) { const p = tp(args[k], args[k+1]); cx = p[0]; cy = p[1]; sx = cx; sy = cy; k += 2; }
          else if (op === 1 || op === 4) {
            let nx, ny;
            if (op === 1) { const p = tp(args[k], args[k+1]); nx = p[0]; ny = p[1]; k += 2; } else { nx = sx; ny = sy; }
            const y1 = H - cy, y2 = H - ny;
            if (Math.abs(y1 - y2) < 0.6 && Math.abs(nx - cx) > 5) hs.push({ y: (y1+y2)/2, x0: Math.min(cx, nx), x1: Math.max(cx, nx) });
            else if (Math.abs(cx - nx) < 0.6 && Math.abs(y1 - y2) > 5) vs.push({ x: (cx+nx)/2, y0: Math.min(y1, y2), y1: Math.max(y1, y2) });
            cx = nx; cy = ny;
          }
          else if (op === 2) { const p = tp(args[k+4], args[k+5]); cx = p[0]; cy = p[1]; k += 6; }
          else if (op === 3) { const p = tp(args[k+2], args[k+3]); cx = p[0]; cy = p[1]; k += 4; }
        }
      }
    }
    return { hs, vs };
  }
  async function getItems(page, H) {
    const tc = await page.getTextContent();
    let rawItems = tc.items.map(i => {
      const t = i.transform; const rot = Math.abs(t[1]) > Math.abs(t[0]); const diag = !rot && Math.abs(t[1]) > 0.2 * Math.abs(t[0]);
      return { s: i.str || '', x: t[4], y: H - t[5], rot, diag, w: i.width || 0, fs: Math.hypot(t[0], t[1]) };
    });
    // Kararlı ve kesin satır-sütun sıralaması (Y koordinatı kovaları ile)
    rawItems.sort((a,b) => {
      const kyA = Math.round(a.y / 2.5), kyB = Math.round(b.y / 2.5);
      if (kyA !== kyB) return kyA - kyB;
      return a.x - b.x;
    });
    const items = [];
    for (let j = 0; j < rawItems.length; j++) {
       const it = rawItems[j];
       if (/^\s*$/.test(it.s) && it.s.indexOf('*') === -1) continue; 
       const last = items[items.length - 1];
       let gw = last ? (last.w || last.fs/2 * last.s.length) : 0;
       const gap = it.x - (last ? (last.x + gw) : 0);

       const isLastNum = last && /^\d{1,2}$/.test(last.s.trim());
       const isItNum = /^\d{1,2}$/.test(it.s.trim());
       const isLastStar = last && /^[\s*xX•·■●+vV]+$/.test(last.s.trim());
       const isItStar = /^[\s*xX•·■●+vV]+$/.test(it.s.trim());
       const preventMerge = (isLastNum && isItNum) || isLastStar || isItStar || (last && isItStar) || (isLastStar && !isItStar);

       if (!preventMerge && last && !last.rot && !it.rot && Math.abs(last.y - it.y) < 2.5 && gap > -6 && gap < last.fs * 0.45) {
           last.s += it.s;
           last.w = (it.x + it.w) - last.x;
       } else {
           items.push(Object.assign({}, it));
       }
    }
    return items.filter(i => i.s.trim());
  }
  // birleştirilmiş çizgi koordinatları (x veya y değerleri)
  function uniq(vals, tol) { vals.sort((a,b)=>a-b); const out=[]; for (let v_idx = 0; v_idx < vals.length; v_idx++) { const v = vals[v_idx]; if (!out.length || v - out[out.length-1] > tol) out.push(v); } return out; }
  function stars(items) {
    const out = [];
    for (let it_idx = 0; it_idx < items.length; it_idx++) { const it = items[it_idx];
      if (it.diag || !/^[\s*xX•·■●+vV]+$/.test(it.s)) continue;
      const n = it.s.length;
      const w = it.w || (it.fs * 0.6 * n);
      for (let j = 0; j < n; j++) {
        if (/[*xX•·■●+vV]/.test(it.s[j])) out.push({ x: it.x + (j + 0.5) * w / n, y: it.y });
      }
    }
    return out;
  }
  function extractNumberTokens(it) {
    const tokens = [];
    const re = /\b\d{1,4}\b/g;
    let m;
    const str = it.s;
    const w = it.w || (it.fs * 0.6 * str.length);
    while ((m = re.exec(str))) {
      const num = m[0];
      let cx;
      if (it.rot) {
        cx = it.x;
      } else {
        const frac = (m.index + num.length / 2) / Math.max(1, str.length);
        cx = it.x + frac * w;
      }
      tokens.push({ num, cx, y: it.y });
    }
    return tokens;
  }
  function textLines(items) {
    const its = items.filter(i => !i.rot).sort((a,b)=>a.y-b.y || a.x-b.x);
    const lines = [];
    for (let it_idx = 0; it_idx < its.length; it_idx++) { const it = its[it_idx];
      const L = lines[lines.length-1];
      if (L && Math.abs(L.y - it.y) < 5.5) L.items.push(it); else lines.push({ y: it.y, items: [it] });
    }
    return lines.map(l => l.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' '));
  }
  function parseCables(txt) {
    txt = txt.replace(/\s+/g, ' ').trim();
    const cables = [];
    const re = /\(?([^\(\)]+?)\)\s*([0-9]+[.,][0-9]+)\s*([A-Za-zÇĞİÖŞÜçğıöşü\-\/]+)/g;
    let m;
    let firstMatchIdx = -1;
    while ((m = re.exec(txt))) {
      if (firstMatchIdx === -1) firstMatchIdx = m.index;
      const conn = m[1].replace(/\s+/g, ' ').trim();
      let color = m[3].replace(/\s*-\s*/g, '-').replace(/\s+/g, ' ').trim();
      const parts = conn.split(/-(?=[A-Z])/);
      cables.push({
        conn,
        from: (parts[0] || '').trim(),
        to: parts.slice(1).join('-').trim(),
        sec: m[2].replace(',', '.'),
        color
      });
    }
    const note = firstMatchIdx > 0 ? txt.slice(0, firstMatchIdx).trim() : (cables.length === 0 ? txt : '');
    return { note, cables };
  }

  const result = { matrix: null, features: null, drawings: {}, meta: {} };
  for (let pn = 1; pn <= doc.numPages; pn++) {
    log(`Sayfa ${pn}/${doc.numPages} okunuyor…`);
    const page = await doc.getPage(pn);
    const H = page.view[3];
    const items = await getItems(page, H);
    const full = items.map(i => i.s).join(' ');
    // meta
    if (!result.meta.docNo) { const m = full.match(/D-\d{6}xx\d{2}\s*\/\s*([A-Z]{1,3})/); if (m) { result.meta.docNo = m[0].replace(/\s+/g,' '); result.meta.rev = m[1]; } }
    if (!result.meta.title) { const t = items.find(i => APP_CONFIG.titleKeywords.test(i.s)); if (t) result.meta.title = t.s.trim(); }
    // teknik resim tip başlıkları
    for (let it_idx = 0; it_idx < items.length; it_idx++) { const it = items[it_idx];
      const m = it.s.match(/T[İI]P\/TYPE\s*([\-0-9 ]{2,})/);
      if (m && it.fs > 14) {
        const sheet = (full.match(/\b(\d+)\/(\d+)\b(?!\.)/) || [])[0] || '';
        const kind = /COMPONENT SIDE VIEW/.test(full) ? 'Elektrik şeması' : 'Montaj resmi';
        m[1].split(/[- ]+/).filter(Boolean).forEach(t => { const L = (result.drawings[t] = result.drawings[t] || []); if (!L.some(d => d.page === pn)) L.push({ page: pn, sheet, kind }); });
      }
    }
    const nStars = items.filter(i => !i.rot && /^[\s*xX•·■●+vV]+$/.test(i.s)).length;
    const refCell = items.find(i => !i.rot && /^REF\.?$/i.test(i.s.trim().replace(/\s/g, '')));
    const hasMatrix = opts.matrixPage ? pn === opts.matrixPage : (refCell !== undefined || (/CABLE\s*DEFINITION/i.test(full) && nStars > 15) || nStars > 35);
    const normFull = (full || '').toUpperCase().replace(/İ/g, 'I').replace(/ı/g, 'I');
    const hasFeat = !result.features && /COMPETITIVE|STANDART|DOZA[GJ]|TURBL|AQUASTOP|AQUATECH|FLOWMET|D[RU]RUM\s*LED|IVME|ACCELERATION|JET/.test(normFull);
    if (!hasMatrix && !hasFeat) continue;

    // Çizgileri birleştir (Geometrik/Lattice yaklaşımı - O(N) kova gruplaması)
    function mergeSegments(lines, isHoriz, tol) {
        tol = tol || 2;
        const bucket = {};
        for (let i = 0; i < lines.length; i++) {
            const l = lines[i];
            const fixed = isHoriz ? l.y : l.x;
            const key = Math.round(fixed / tol);
            (bucket[key] = bucket[key] || []).push(l);
        }
        const merged = [];
        for (const key in bucket) {
            const list = bucket[key];
            const fixed = isHoriz ? list[0].y : list[0].x;
            const segs = list.map(l => isHoriz ? [l.x0, l.x1] : [l.y0, l.y1]);
            segs.sort((a,b) => a[0] - b[0]);
            let cur = [...segs[0]];
            for (let i = 1; i < segs.length; i++) {
                const s = segs[i];
                if (s[0] <= cur[1] + tol) {
                    cur[1] = Math.max(cur[1], s[1]);
                } else {
                    merged.push(isHoriz ? { y: fixed, x0: cur[0], x1: cur[1] } : { x: fixed, y0: cur[0], y1: cur[1] });
                    cur = [...s];
                }
            }
            merged.push(isHoriz ? { y: fixed, x0: cur[0], x1: cur[1] } : { x: fixed, y0: cur[0], y1: cur[1] });
        }
        return merged;
    }

    let mergedVs = [], mergedHs = [];
    if (hasMatrix && !result.matrix) {
      log(`Sayfa ${pn}: tablo çizgileri çıkarılıyor…`);
      try {
        const { hs, vs } = await getSegments(page, H);
        mergedVs = mergeSegments(vs, false, 2);
        mergedHs = mergeSegments(hs, true, 2);
      } catch (segErr) {
        console.warn(`Sayfa ${pn} çizgi analizi uyarısı:`, segErr);
      }
    }

    // ===== 1. KABLO MATRİS TABLOSU PARSERI =====
    if (hasMatrix && !result.matrix) { try {
      let headY = null, ref_x = null;
      if (refCell) {
        headY = refCell.y;
        ref_x = refCell.x;
      } else {
        const twoDigits = items.filter(i => !i.rot && /^\d{2}$/.test(i.s.trim()));
        const byY = {};
        twoDigits.forEach(i => {
          const k = Math.round(i.y / 6) * 6;
          byY[k] = (byY[k] || 0) + 1;
        });
        const best = Object.entries(byY).sort((a,b) => b[1] - a[1])[0];
        if (best && best[1] >= 2) {
          headY = parseFloat(best[0]);
          const inRow = twoDigits.filter(i => Math.abs(i.y - headY) < 15);
          ref_x = Math.max(...inRow.map(i => i.x)) + 25;
        }
      }
      if (!headY || !ref_x) throw new Error(`Sayfa ${pn} içinde 'REF' başlıklı kablo tablosu bulunamadı`);

      const headItems = items.filter(i => !i.rot && Math.abs(i.y - headY) < 25 && i.x < ref_x + 15);
      const rawTokens = [];
      for (const it of headItems) {
        rawTokens.push(...extractNumberTokens(it).filter(t => t.cx < ref_x + 10 && t.num.length <= 2));
      }
      
      rawTokens.sort((a,b) => b.cx - a.cx);
      const validColsRL = [];
      let lastX = ref_x;
      for (const t of rawTokens) {
        if (!validColsRL.some(u => u.num === t.num && Math.abs(u.cx - t.cx) < 7)) {
          if (lastX - t.cx > 55) break;
          validColsRL.push(t);
          lastX = t.cx;
        }
      }
      if (validColsRL.length < 2) throw new Error(`Sayfa ${pn} içinde tip başlıkları (01, 02 …) bulunamadı`);
      
      const uniqTokens = validColsRL.slice().sort((a,b) => a.cx - b.cx);
      
      const typeCols = [];
      for (let k = 0; k < uniqTokens.length; k++) {
        const cur = uniqTokens[k];
        let a, b;
        if (k === 0) {
          const next = uniqTokens[k+1];
          const w = next ? (next.cx - cur.cx) : 20;
          a = cur.cx - w / 2;
        } else {
          a = (uniqTokens[k-1].cx + cur.cx) / 2;
        }
        if (k === uniqTokens.length - 1) {
          b = ref_x;
        } else {
          b = (cur.cx + uniqTokens[k+1].cx) / 2;
        }
        
        const snapLeft = mergedVs.find(v => Math.abs(v.x - a) < 6 && v.y0 < headY + 20 && v.y1 > headY + 60);
        if (snapLeft) a = snapLeft.x;
        const snapRight = mergedVs.find(v => Math.abs(v.x - b) < 6 && v.y0 < headY + 20 && v.y1 > headY + 60);
        if (snapRight) b = snapRight.x;
        
        typeCols.push({ lab: cur.num.padStart(2, '0'), a, b, cx: cur.cx });
      }
      
      const refItems = items.filter(i => !i.rot && Math.abs(i.x - ref_x) < 45 && i.y > headY + 5 && /\d{4}/.test(i.s));
      refItems.sort((a,b) => a.y - b.y);
      
      let hy = [];
      if (refItems.length > 0) {
        hy.push(headY + 10);
        for (let k = 0; k < refItems.length - 1; k++) {
          hy.push((refItems[k].y + refItems[k+1].y) / 2);
        }
        hy.push(refItems[refItems.length - 1].y + 35);
      } else {
        const minA = Math.min(...typeCols.map(c => c.a));
        const rowLines = mergedHs.filter(h => h.x0 < minA + 25 && h.x1 > ref_x + 30);
        hy = uniq(rowLines.filter(h => h.y > headY + 2).map(h => h.y), 2);
      }
      
      const st = stars(items);
      const minA = Math.min(...typeCols.map(c => c.a));
      const rightX = ref_x + 2000;
      const rows = [];
      
      for (let r = 0; r + 1 < hy.length; r++) {
        const y0 = hy[r], y1 = hy[r+1];
        const inRow = items.filter(i => i.y > y0 && i.y <= y1);
        const refTxt = inRow.filter(i => !i.rot && Math.abs(i.x - ref_x) < 45).map(i => i.s).join(' ');
        const refs = (refTxt.match(/\d{4}/g) || []);
        if (!refs.length) continue;
        
        const types = new Set();
        st.filter(s => s.y > y0 && s.y <= y1 && s.x >= minA - 5 && s.x < ref_x).forEach(s => {
          const c = typeCols.find(c => s.x >= c.a && s.x < c.b);
          if (c) types.add(c.lab);
        });
        
        const txt = textLines(inRow.filter(i => i.x >= ref_x + 25 && i.x < rightX - 5 && !/^[\s*]+$/.test(i.s))).join(' ');
        const { note, cables } = parseCables(txt);
        rows.push({ refs, note, cables, types: Array.from(types) });
      }
      if (rows.length) {
        const allTypeLabs = Array.from(new Set(typeCols.map(c => c.lab))).sort((a,b) => (+a)-(+b));
        result.matrix = { page: pn, numPages: doc.numPages, types: allTypeLabs, rows };
      }
    } catch (e) { 
      if (setStatus) setStatus(`Tablo okuma hatası (Sayfa ${pn}): ${e.message}`, true);
      console.error(e); 
      if (opts.matrixPage) throw e; 
    } }

    // ===== 2. ÖZELLİK VE OPSİYON TABLOSU PARSERI =====
    if (hasFeat && !result.features) { try {
      const normStr = s => (s || '').toUpperCase().replace(/İ/g, 'I').replace(/ı/g, 'I');
      const KNOWN_FEAT_RE = /IVME|ACCELERATION|STANDART|COMPETITIVE|AQUATECH|D[RU]RUM\s*LED|TURBL|AQUASTOP|MIKRO\s*FIBER|FLOWMET|JET|DOZA[GJ]/;
      const st = stars(items);
      
      // 1. Özellik tablosundaki etiketleri bul (X koordinatına göre dikey kolon kümelemesi ile)
      const candidateLabels = items.filter(i => !i.rot && KNOWN_FEAT_RE.test(normStr(i.s)));
      const clusters = [];
      candidateLabels.forEach(c => {
        if (!st.some(s => s.x < c.x && Math.abs(s.y - c.y) < 25)) return;
        let g = clusters.find(cl => Math.abs(cl.x - c.x) < 40);
        if (!g) { g = { x: c.x, items: [] }; clusters.push(g); }
        g.items.push(c);
        g.x = g.items.reduce((sum, it) => sum + it.x, 0) / g.items.length;
      });
      clusters.sort((a, b) => b.items.length - a.items.length);
      
      let tableLabels = (clusters.length && clusters[0].items.length >= 2) ? clusters[0].items : [];
      if (!tableLabels.length) {
        const fallbackClusters = [];
        candidateLabels.forEach(c => {
          let g = fallbackClusters.find(cl => Math.abs(cl.x - c.x) < 40);
          if (!g) { g = { x: c.x, items: [] }; fallbackClusters.push(g); }
          g.items.push(c);
          g.x = g.items.reduce((sum, it) => sum + it.x, 0) / g.items.length;
        });
        fallbackClusters.sort((a, b) => b.items.length - a.items.length);
        if (fallbackClusters.length && fallbackClusters[0].items.length >= 2) {
          tableLabels = fallbackClusters[0].items;
        }
      }
      if (!tableLabels.length) throw new Error("Özellik satır etiketleri bulunamadı");
      
      const fx = Math.min(...tableLabels.map(f => f.x));
      const minLabelY = Math.min(...tableLabels.map(f => f.y));
      const maxLabelY = Math.max(...tableLabels.map(f => f.y));
      
      // 2. Tablodaki Tip Numaraları satırını bul (Token çıkarma ve Y kova analizi ile)
      const candNums = items.filter(i => !i.rot && i.x < fx && i.x > fx - 950 && 
        (Math.abs(i.y - (maxLabelY + 15)) < 40 || Math.abs(i.y - (minLabelY - 15)) < 40 || Math.abs(i.y - maxLabelY) < 70 || Math.abs(i.y - minLabelY) < 70)
      );
      
      const numToks = [];
      candNums.forEach(it => {
        const toks = extractNumberTokens(it);
        toks.forEach(t => {
          if (t.num.length <= 2) {
            numToks.push({ num: t.num.padStart(2, '0'), cx: t.cx, y: t.y });
          }
        });
      });
      
      const byY = {};
      numToks.forEach(t => {
        const k = Math.round(t.y / 5) * 5;
        byY[k] = (byY[k] || 0) + 1;
      });
      const bestYEntries = Object.entries(byY).sort((a,b) => b[1] - a[1]);
      const bestY = bestYEntries.length ? parseFloat(bestYEntries[0][0]) : (maxLabelY + 15);
      
      const rowToks = numToks.filter(t => Math.abs(t.y - bestY) < 15);
      rowToks.sort((a,b) => b.cx - a.cx);
      
      const validColsRL = [];
      let lastX = fx;
      for (const t of rowToks) {
        if (!validColsRL.some(u => u.num === t.num && Math.abs(u.cx - t.cx) < 7)) {
          if (lastX - t.cx > 55) break;
          validColsRL.push(t);
          lastX = t.cx;
        }
      }
      if (validColsRL.length < 2) throw new Error("Özellik tablosu sütunları ayrıştırılamadı");
      
      const uniqCols = validColsRL.slice().sort((a,b) => a.cx - b.cx);
      
      const cols = [];
      for (let k = 0; k < uniqCols.length; k++) {
        const cur = uniqCols[k];
        let a, b;
        if (k === 0) {
          const next = uniqCols[k+1];
          const w = next ? (next.cx - cur.cx) : 15;
          a = cur.cx - w / 2;
        } else {
          a = (uniqCols[k-1].cx + cur.cx) / 2;
        }
        if (k === uniqCols.length - 1) {
          b = fx;
        } else {
          b = (cur.cx + uniqCols[k+1].cx) / 2;
        }
        cols.push({ type: cur.num, a, b, cx: cur.cx, desc: "" });
      }
      
      // 3. Her sütun için Hacim Açıklamasını (P-kodu: TEK_P54, P54_IPTAL, P50 vb.) bul
      const P_REGEX = /P\d+/i;
      const minColA = Math.min(...cols.map(c => c.a));
      const pItems = items.filter(i => !i.rot && i.x >= minColA - 15 && i.x <= fx + 15 && P_REGEX.test(i.s) && i.y > maxLabelY);
      
      const fColsDescOrder = cols.slice().sort((a,b) => b.cx - a.cx);
      const pItemsDescOrder = pItems.slice().sort((a,b) => b.x - a.x);
      
      if (pItemsDescOrder.length >= fColsDescOrder.length) {
        for (let k = 0; k < fColsDescOrder.length; k++) {
          fColsDescOrder[k].desc = pItemsDescOrder[k].s.trim().toUpperCase();
        }
      } else {
        cols.forEach(c => {
          const matching = pItems.filter(p => Math.abs(p.x - c.cx) < 14 || Math.abs((p.x + (p.w||0)/2) - c.cx) < 16);
          if (matching.length) {
            matching.sort((a,b) => Math.abs(a.x - c.cx) - Math.abs(b.x - c.cx));
            c.desc = matching[0].s.trim().toUpperCase();
          } else {
            const headerTexts = items.filter(i => i.x >= c.a && i.x < c.b && i.y > maxLabelY + 15 && i.y < maxLabelY + 250 && /[A-Z0-9]/i.test(i.s) && !/^\d{1,2}$/.test(i.s.trim()) && !/^[\s*]+$/.test(i.s));
            if (headerTexts.length) {
              headerTexts.sort((a, b) => b.y - a.y);
              c.desc = headerTexts.map(i => i.s.trim()).filter(Boolean).join('_').toUpperCase();
            }
          }
        });
      }
      
      // 4. Özellik satırlarını ve etiketlerini tespit et (yalnızca özellik tablosu Y sınırları içinde!)
      const labelColumnItems = items.filter(i => !i.rot && i.x >= fx - 10 && i.x <= fx + 350 && i.y >= minLabelY - 10 && i.y <= maxLabelY + 10 && !/^[\s*]+$/.test(i.s));
      const rawRowYs = Array.from(new Set(labelColumnItems.map(f => Math.round(f.y * 10) / 10))).sort((a,b)=>a-b);
      const rowYs = [];
      for (let y_idx = 0; y_idx < rawRowYs.length; y_idx++) {
        const y = rawRowYs[y_idx];
        if (!rowYs.length || y - rowYs[rowYs.length - 1] > 8) rowYs.push(y);
      }
      const fhy = [];
      if (rowYs.length > 0) {
        fhy.push(rowYs[0] - 8);
        for (let k = 0; k < rowYs.length - 1; k++) fhy.push((rowYs[k] + rowYs[k+1]) / 2);
        fhy.push(rowYs[rowYs.length - 1] + 10);
      }
      
      const feats = [];
      for (let k = 0; k < fhy.length - 1; k++) {
        const y0 = fhy[k], y1 = fhy[k+1];
        const rowLabels = labelColumnItems.filter(i => i.y > y0 && i.y <= y1);
        rowLabels.sort((a,b) => a.x - b.x);
        let lbl = rowLabels.map(i => i.s.trim()).join(' ').replace(/\s+/g, ' ').trim();
        if (!lbl || lbl.length < 2) continue;
        
        const ts = new Set();
        st.filter(s => s.y > y0 - 3 && s.y <= y1 + 3 && s.x < fx).forEach(s => {
          const col = cols.find(c => s.x >= c.a - 2 && s.x < c.b + 2);
          if (col && col.type) ts.add(col.type);
        });
        
        feats.push({ name: lbl, types: Array.from(ts) });
      }
      if (!feats.length) throw new Error("Özellik satırları boş kaldı");
      
      // 5. types objesini oluştur
      const types = {};
      cols.forEach(c => {
        types[c.type] = {
          desc: c.desc || "",
          features: feats.filter(f => f.types.includes(c.type)).map(f => f.name)
        };
      });
      result.features = { page: pn, names: feats.map(f => f.name), types };
    } catch (e) { log('Tip açıklama tablosu okunamadı: ' + e.message); console.error(e); } }
  }
  return result;
}

/* ---------- karşılaştırma ---------- */

  const mA = mapOf(rA), mB = mapOf(rB);
  const changed = [], onlyA = [], onlyB = [];
  mA.forEach((v, k) => { if (!mB.has(k)) onlyA.push(v); else { const w = mB.get(k); if (w.c.sec !== v.c.sec || colorName(w.c.color) !== colorName(v.c.color)) changed.push([v, w]); } });
  mB.forEach((v, k) => { if (!mA.has(k)) onlyB.push(v); });

  h += `<p class="verdict">${nDiff === 0 && !gOnlyA.length && !gOnlyB.length ? `Tip ${A} ve Tip ${B} aynı kablo setini kullanıyor.` :

      ${r.note ? `<p class="altnote">${esc(altText(r))}</p>` : ""}<div class="tbl"><table><tbody>${cs.map(c => cableRow(c)).join("")}</tbody></table></div></div>`);

  const grpTable = (list) => `<div class="tbl"><table><thead><tr><th>Kablo grubu</th><th>Ref</th><th class="mark">Tip ${A}</th><th class="mark">Tip ${B}</th></tr></thead><tbody>` +
    list.map(r => { const a = gA.has(gKey(r)), b = gB.has(gKey(r)); return `<tr${a !== b ? ' class="diffrow"' : ""}><td>${esc(groupName(r))}${r.note ? " <small>(alternatif)</small>" : ""}</td><td>${esc(refLabel(r))}</td>

  h += `<div style="margin-top:26px">${similarBlock(A, { selected: B })}</div>`;
  return h;

/* Türkçe sayı ekleri: Tip 55'e, Tip 46'da … */

    10:["a","da","u"],20:["ye","de","yi"],30:["a","da","u"],40:["a","ta","ı"],50:["ye","de","yi"],60:["a","ta","ı"],70:["e","te","i"],80:["e","de","i"],90:["a","da","ı"],100:["e","de","ü"],1000:["e","de","i"]};
  let k = n % 10 || (n % 100) || (n % 1000 ? 100 : 1000);

const tp = (t, kind) => `Tip ${t}'${trSuffix(t, kind)}`;

}

}

    const stats = diffStats(t, u);
    const fo = featOverlap(t, u);
    const uVol = getVolume(u);

    const res = { t: u, fo: fo, volMatch: volMatch, uVol: uVol }; Object.keys(stats).forEach(k => res[k] = stats[k]); return res;

      <td class="rank">${i + 1}</td>

      </td>

  return `<div class="simbox"><div class="simhead"><h2>${tp(t, "dat")} en çok benzeyen tipler</h2>

/* ---------- PDF föyü ---------- */
const PDF_COL = { RED:"#C62828", BLUE:"#1F5FBF", BROWN:"#6D4C2F", GRAY:"#8E959A", GREY:"#8E959A", ORANGE:"#E8761E", WHITE:"#FFFFFF", YELLOW:"#F2C318", GREEN:"#2E8B3A", PINK:"#E86FA8", PURPLE:"#7B3FA0", PURPELE:"#7B3FA0", BLACK:"#1A1A1A" };

    if (right) this.p.text(right, this.R, this.y + 5, { size: 9, color: "#55636A", align: "right" });
    this.y += 7; this.p.line(this.L, this.y, this.R, this.y, { lw: 0.8 }); this.y += 2;
  }
  para(t, o = {}) {

    for (let l_idx = 0; l_idx < lines.length; l_idx++) { const l = lines[l_idx]; this.need(lh + 1); this.p.text(l, this.L + (o.indent || 0), this.y + lh, { size, bold: o.bold, color: o.color }); this.y += lh + 0.6; }

    const h = Math.min(2.6, 0.9 + parseFloat(sec) * 1.1);
    const yy = y - h / 2;
    this.p.rect(x - 1.6, y - 0.35, 1.8, 0.7, { fill: "#A8A8A8" });
    this.p.rect(x + w - 0.2, y - 0.35, 1.8, 0.7, { fill: "#A8A8A8" });
    this.p.rect(x, yy, w, h, { fill: PDF_COL[parts[0]] || "#999999", stroke: parts[0] === "WHITE" ? "#8E959A" : null, lw: 0.3 });
    if (parts[1]) for (let s = x + 1.5; s < x + w - 1; s += 3.2) this.p.rect(s, yy, 1.1, h, { fill: PDF_COL[parts[1]] });

      cols.forEach((c, i) => p.text(c.t, xs[i] + pad, this.y + 4.2, { bold: true, size: 8, color: "#33424A" }));

    S.p.text(`Tip ${t}`, x + 3, S.y + 13, { bold: true, size: 18 });
    S.p.text(typeInfo(t).desc || "", x + 3, S.y + 19, { bold: true, size: 10 });
    S.p.wrap("Opsiyonlar: " + featText(t), half - 6, { size: 8 }).slice(0, 2).forEach((l, k) => S.p.text(l, x + 3, S.y + 24 + k * 3.6, { size: 8 }));
  });
  S.y += 34;
  // sonuç
  const verdict = d.diff === 0 ? `Tip ${A} ile Tip ${B} aynı kablo setini kullanıyor. Kablo farkı yok.`
    : `Tip ${A}, Tip ${B} ile ${d.same} kablo ortak kullanıyor (%${d.pct}). Fark: ${d.changed.length} kablo değişiyor, ${d.onlyA.length} kablo sadece ${tp(A, "loc")}, ${d.onlyB.length} kablo sadece ${tp(B, "loc")} var.`;
  const vl = S.p.wrap(verdict, S.R - S.L - 8, { size: 11, bold: true });
  S.p.rect(S.L, S.y, S.R - S.L, vl.length * 5.2 + 5, { fill: "#F7E8CC", stroke: "#B86E00", lw: 0.8 });
  vl.forEach((l, k) => S.p.text(l, S.L + 4, S.y + 6.5 + k * 5.2, { bold: true, size: 11 }));
  S.y += vl.length * 5.2 + 9;
  const fa = typeInfo(A).features, fb = typeInfo(B).features;
  const oa = fa.filter(f => !fb.includes(f)), ob = fb.filter(f => !fa.includes(f));
  if (oa.length || ob.length) S.para(`Opsiyon farkı: sadece ${tp(A, "loc")} ${oa.join(", ") || "yok"}; sadece ${tp(B, "loc")} ${ob.join(", ") || "yok"}.`, { size: 9.5 });

  if (d.changed.length) {
    S.h2("1. Aynı bağlantı, farklı kablo", `${d.changed.length} kablo`);
    S.table([{ t: "Bağlantı", w: 62 }, { t: `${tp(B, "loc")}`, w: 60 }, { t: `${tp(A, "loc")} kullanılacak`, w: 60 }],
      d.changed.map(([v, w]) => ({ fill: "#FBF3E2", cells: [`${v.c.from} → ${v.c.to}`, { wire: [w.c.color, w.c.sec], text: `${w.c.sec} mm² ${colorName(w.c.color)} (Ref ${refLabel(w.r)})` }, { wire: [v.c.color, v.c.sec], text: `${v.c.sec} mm² ${colorName(v.c.color)} (Ref ${refLabel(v.r)})`, bold: true }] })));
  }
  const onlyTable = (arr) => S.table([{ t: "Kablo", w: 44 }, { t: "Bağlantı", w: 76 }, { t: "Grup", w: 36 }, { t: "Ref", w: 26 }],
    arr.map(v => cableCells(v.c).concat([groupName(v.r) + (v.r.note ? " (alternatif)" : ""), refLabel(v.r)])));
  let n = d.changed.length ? 2 : 1;
  S.h2(`${n++}. Sadece ${tp(A, "loc")} olan kablolar`, d.onlyA.length ? `${d.onlyA.length} kablo` : "yok");
  if (d.onlyA.length) onlyTable(d.onlyA); else S.para(`${tp(B, "loc")} olmayan ek kablo yok.`);
  S.h2(`${n++}. Sadece ${tp(B, "loc")} olan kablolar`, d.onlyB.length ? `${d.onlyB.length} kablo` : "yok");
  if (d.onlyB.length) onlyTable(d.onlyB); else S.para(`${tp(A, "loc")} eksik kalan kablo yok.`);

  // benzer tipler
  const sims = similarTypes(A, 5);
  S.h2(`${n++}. ${tp(A, "dat")} en çok benzeyen tipler`);
  S.table([{ t: "Sıra", w: 12, align: "center" }, { t: "Tip", w: 18 }, { t: "Açıklama", w: 70 }, { t: "Ortak", w: 22, align: "center" }, { t: "Kablo farkı", w: 60 }],
    sims.map((s, i) => ({ fill: s.t === B ? "#F1DDE8" : null, cells: [String(i + 1), { text: `Tip ${s.t}`, bold: true }, typeInfo(s.t).desc, `%${s.pct}`, s.diff === 0 ? "Aynı kablo seti" : `${s.diff} (${s.changed.length} değişen, ${s.onlyA.length} eksik, ${s.onlyB.length} fazla)`] })));
  S.signatures();
  return S.finish(`Kablo tip asistanı   ${drawingLabel()}   Kaynak: kablo tablosu PDF sayfa ${DATA.matrix.page}. Üretimden önce teknik resimle doğrulayın.`);
}

function buildTypePDF(T) {
  const S = new Sheet(`Tip ${T} kablo listesi`, `Çizim ${drawingLabel()}   Hazırlanma tarihi ${todayTR()}`);
  S.p.text(`Tip ${T}`, S.L, S.y + 9, { bold: true, size: 24 });
  S.p.text(typeInfo(T).desc || "", S.L + 40, S.y + 5, { bold: true, size: 11 });
  S.p.text("Opsiyonlar: " + featText(T), S.L + 40, S.y + 10.5, { size: 9 });
  S.y += 15;
  const dr = (DATA.drawings && DATA.drawings[T]) || [];
  if (dr.length) S.para(dr.map(x => `${x.kind}: PDF sayfa ${x.page}${x.sheet ? " (pafta " + x.sheet + ")" : ""}`).join("   "), { size: 9, color: "#55636A" });
  const sims = similarTypes(T, 5);
  if (sims.length) S.para("En çok benzeyen tipler: " + sims.map(s => `Tip ${s.t} (${s.diff === 0 ? "aynı set" : s.diff + " kablo farkı"})`).join(", "), { size: 9.5, bold: true });
  rowsFor(T).forEach(r => {
    S.h2(groupName(r) + (r.note ? " (alternatif)" : ""), "Ref " + refLabel(r));
    if (r.note) S.para(altText(r), { size: 8.5, color: "#8A5300" });
    S.table([{ t: "Kablo", w: 50 }, { t: "Bağlantı", w: 132 }], r.cables.map(c => cableCells(c)));
  });
  S.signatures();
  return S.finish(`Kablo tip asistanı   ${drawingLabel()}   Kaynak: kablo tablosu PDF sayfa ${DATA.matrix.page}. Üretimden önce teknik resimle doğrulayın.`);
}

const dlPromise = (window.claude && typeof window.claude.use === "function") ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null);
async function savePDF(bytes, filename, btn) {
  const old = btn ? btn.textContent : "";
  try {
    if (btn) { btn.disabled = true; btn.textContent = "Hazırlanıyor…"; }
    const dl = await dlPromise;
    if (dl) {
      await dl.save({ filename, data: new Blob([bytes]) });
      setStatus(`${filename} kaydedildi.`);
    } else {
      const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
      const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      setStatus(`${filename} indirildi.`);
    }
  } catch (e) {
    if (e && e.code === "declined") setStatus("PDF kaydı iptal edildi.");
    else setStatus("PDF kaydedilemedi: " + (e && e.message ? e.message : e), true);
  } finally { if (btn) { btn.disabled = false; btn.textContent = old; } }
}
window.__buildComparePDF = buildComparePDF; window.__buildTypePDF = buildTypePDF;

window.updateLength = (conn, val) => {
  DATA.lengths = DATA.lengths || {};
  DATA.lengths[conn] = val;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); } catch(e){}
  render();
};

function renderLength() {
  const S = new Set();
  DATA.matrix.rows.forEach(r => r.cables.forEach(c => S.add(c.from + " \u2192 " + c.to)));
  const uniqueConns = [];
  S.forEach(v => uniqueConns.push(v));
  uniqueConns.sort();
  DATA.lengths = DATA.lengths || {};
  
  let rows = uniqueConns.map(conn => {
     const v = DATA.lengths[conn] || "";
     return `<tr><td><b>${conn}</b></td>
     <td><input type="number" value="${v}" onchange="updateLength('${conn}', this.value)" style="width:80px; padding:4px;" placeholder="Boy (mm)"></td></tr>`;
  }).join("");

  return `<div class="simbox" style="margin-top:16px"><div class="simhead" style="grid-template-columns:1fr"><div>
      <h2 style="color:var(--warn)">Kablo Boyu (Metraj) Eşleştirme Sözlüğü</h2>
      <p style="margin-top:4px">PDF geometrisini okumak hatalara açık olduğundan, aşağıdaki tabloda bir defaya mahsus bağlantıların uzunluğunu girebilirsiniz. Girilen değerler otomatik kaydedilir ve Tip Özetlerinde toplam metrajı hesaplar.</p>
    </div></div>
    <div class="tbl"><table class="simtbl" style="max-width:400px"><thead><tr><th style="text-align:left; padding:8px">Bağlantı Yönü</th><th style="text-align:left; padding:8px">Uzunluk (mm)</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* ---------- akış ---------- */
function render() {
  [].forEach.call(document.querySelectorAll(".modes button"), b => b.setAttribute("aria-selected", String(b.dataset.mode === state.mode)));
  renderGrid();
  const p = $("#panel");
  p.innerHTML = state.mode === "sum" ? renderSummary() : state.mode === "cmp" ? renderCompare() : state.mode === "len" ? renderLength() : renderMatrix();
  const sa = $("#selA"), sb = $("#selB");
  if (sa) sa.onchange = () => { state.a = sa.value || null; render(); syncHash(); };
  if (sb) sb.onchange = () => { state.b = sb.value || null; render(); syncHash(); };
  [].forEach.call(p.querySelectorAll("[data-cmp]"), b => b.onclick = () => { state.b = b.dataset.cmp; state.mode = "cmp"; $("#q").value = state.a + " " + state.b; render(); syncHash(); window.scrollTo({ top: $(".modes").offsetTop - 10, behavior: "smooth" }); });
  [].forEach.call(p.querySelectorAll("[data-simn]"), b => b.onclick = () => { state.simN = +b.dataset.simn; render(); });
  const pc = $("#pdfCmp"); if (pc) pc.onclick = () => savePDF(buildComparePDF(state.a, state.b), `Tip${state.a}_Tip${state.b}_karsilastirma.pdf`, pc);
  const pt = $("#pdfType"); if (pt) pt.onclick = () => savePDF(buildTypePDF(state.a), `Tip${state.a}_kablo_listesi.pdf`, pt);
  [].forEach.call(p.querySelectorAll("thead th[data-t]"), th => th.onclick = () => { state.a = th.dataset.t; state.mode = "sum"; render(); syncHash(); });
}
function syncHash() {
  const h = state.mode === "cmp" ? `k=${state.a || ""},${state.b || ""}` : state.mode === "mat" ? "tablo" : (state.a ? `tip=${state.a}` : "");
  try { history.replaceState(null, "", "#" + h); } catch (e) {}
}
function readHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("tip=")) { state.a = normType(h.slice(4)); state.mode = "sum"; }
  else if (h.startsWith("k=")) { const [a, b] = h.slice(2).split(","); state.a = normType(a); state.b = normType(b); state.mode = "cmp"; }
  else if (h === "tablo") state.mode = "mat";
}
$("#qform").addEventListener("submit", (e) => {
  e.preventDefault();
  const raw = $("#q").value;
  const nums = (raw.match(/\d{1,4}/g) || []);
  if (!nums.length) { setStatus("Bir tip numarası yazın, örneğin 55.", true); return; }
  const ts = nums.map(normType);
  const bad = nums.filter((n, i) => !ts[i]);
  if (bad.length) { setStatus(`Bu çizimde şu tip yok: ${bad.join(", ")}. Mevcut tipler aşağıda listelendi.`, true); return; }
  setStatus("");
  if (ts.length >= 2) { state.a = ts[0]; state.b = ts[1]; state.mode = "cmp"; }
  else { state.a = ts[0]; if (state.mode !== "cmp") state.mode = "sum"; else state.mode = "sum"; }
  render(); syncHash();
});
$("#typegrid").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-t]"); if (!b) return;
  const t = b.dataset.t;
  if (state.mode === "cmp") {
    if (!state.a || (state.a && state.b)) { state.a = t; state.b = null; }
    else state.b = t;
  } else { state.a = t; if (state.mode === "mat") state.mode = "sum"; }
  $("#q").value = state.mode === "cmp" ? [state.a, state.b].filter(Boolean).join(" ") : t;
  render(); syncHash();
});
[].forEach.call(document.querySelectorAll(".modes button"), b => b.addEventListener("click", () => { state.mode = b.dataset.mode; render(); syncHash(); }));

/* ---------- PDF yükleme ---------- */
function setStatus(msg, err) { const s = $("#status"); s.textContent = msg; s.className = err ? "err" : ""; }
let pdfjsPromise = null;
function loadPdfjs() {
  if (!pdfjsPromise) {
    const base = `https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_VER}/legacy/build/`;
    pdfjsPromise = (async () => {
      await import(base + "pdf.min.js");
      const lib = globalThis.pdfjsLib;
      lib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
      return lib;
    })();
    pdfjsPromise.catch(() => { pdfjsPromise = null; });
  }
  return pdfjsPromise;
}
$("#uploadBtn").onclick = () => $("#file").click();
let lastFile = null;
async function parseFile(f, matrixPage) {
  const lo = document.getElementById('loadingOverlay');
  const lt = document.getElementById('loadingText');
  const updateLoad = (msg) => { if(lo) { lo.classList.add('active'); lt.textContent = msg; } setStatus(msg); };
  try {
    updateLoad("PDF okuyucu yükleniyor…");
    const lib = await loadPdfjs();
    const buf = new Uint8Array(await f.arrayBuffer());
    updateLoad("Çizim açılıyor…");
    const doc = await lib.getDocument({ data: buf, isEvalSupported: false, disableFontFace: true, useSystemFonts: true }).promise;
    const pp = $("#pagePick");
    pp.innerHTML = `<option value="">Otomatik bul</option>` + Array.from({ length: doc.numPages }, (_, i) => `<option value="${i + 1}"${matrixPage === i + 1 ? " selected" : ""}>Sayfa ${i + 1}</option>`).join("");
    $("#pagePickWrap").hidden = false;
    const res = await parseDrawing(lib, doc, updateLoad, { matrixPage });
    if(lo) lo.classList.remove('active');
    if (!res.matrix || !res.matrix.rows.length) {
      if (res.features) {
        setStatus(`“${f.name}” içinde özellik/opsiyon tablosu bulundu ancak kablo tablosu (REF sütunu) otomatik bulunamadı. Lütfen yukarıdaki sayfalar listesinden kablo tablosunun olduğu sayfayı seçin.`, true);
      } else {
        setStatus(`“${f.name}” içinde kablo tablosu (REF sütunu ve tip başlıkları olan * işaretli tablo) otomatik bulunamadı. “Kablo tablosu sayfası” listesinden doğru sayfayı seçin.`, true);
      }
      return;
    }
    res.meta.fileName = f.name;
    DATA = res; custom = true;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(res)); } catch (err) {}
    if (state.a && !normType(state.a)) state.a = null;
    if (state.b && !normType(state.b)) state.b = null;
    if (!state.a) state.a = allTypes().find(t => rowsFor(t).length) || null;
    renderMeta(); render();
    if (!matrixPage) pp.value = "";
    setStatus(`${f.name} yüklendi. Kablo tablosu sayfa ${res.matrix.page}'de bulundu: ${res.matrix.rows.length} kablo grubu, ${allTypes().length} tip.${res.features ? ` Tip açıklama tablosu (Sayfa ${res.features.page}, ${Object.keys(res.features.types).length} tip) bağlandı.` : " Tip açıklama tablosu bulunamadı; sadece kablo tablosu kullanılıyor."}`);
  } catch (err) {
    if(lo) lo.classList.remove('active');
    console.error(err);
    setStatus("PDF okunamadı: " + (err && err.message ? err.message : err) + ". Başka bir sayfa seçmeyi deneyin ya da dosyayı kontrol edin.", true);
  }
}
$("#file").addEventListener("change", (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  if (!/\.pdf$/i.test(f.name) && f.type !== "application/pdf") { setStatus("Lütfen PDF formatındaki teknik resmi seçin.", true); return; }
  lastFile = f; parseFile(f, null);
});
$("#pagePick").addEventListener("change", (e) => { if (lastFile) parseFile(lastFile, e.target.value ? +e.target.value : null); });
$("#resetBtn").onclick = () => {
  DATA = DEFAULT_DATA; custom = false; lastFile = null; $("#pagePickWrap").hidden = true;
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  renderMeta(); render(); setStatus("Örnek çizime (D-145540xx00 / BF) dönüldü.");
};

readHash();
if (!state.a && state.mode === "sum") state.a = "55";
if (state.a) $("#q").value = state.mode === "cmp" ? [state.a, state.b].filter(Boolean).join(" ") : state.a;
renderMeta(); render();
</script>
</body>
